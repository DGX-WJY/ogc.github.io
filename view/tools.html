<!doctype html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b10">
    <meta name="description" data-copy="meta.description" data-copy-attribute="content" content="">
    <title data-copy="meta.title"></title>
    <link rel="icon" href="../Resources/img/OGC.webp" type="image/webp">
    <link rel="stylesheet" href="../styles/General%20Style.css">
    <link rel="stylesheet" href="../styles/pages%20styles/tools/tools.css">
    <script src="../styles/General%20Style.js" defer></script>
</head>
<body data-site-copy="../Resources/txt/site.json" data-page-copy="../Resources/txt/tools%20web/tools.json" data-copy-state="loading">
    <div class="copy-loading" aria-hidden="true"><span class="copy-loading__spinner"></span></div>
    <div class="copy-error" data-copy-error role="alert" hidden>页面文案无法载入，请检查网络连接后刷新页面。</div>
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="./ogc.html" data-copy="common.brand.logoAlt" data-copy-attribute="aria-label">
                <img src="../Resources/img/OGC.webp" alt="" width="42" height="42">
                <span class="brand__name" data-copy="common.brand.short"></span>
                <span class="brand__full" data-copy="common.brand.full"></span>
            </a>
            <a class="site-domain" href="https://www.ogc.l2.ink/">
                <span class="site-domain__dot" aria-hidden="true"></span><span data-copy="common.domain"></span>
            </a>
            <nav class="site-nav" data-copy="common.nav.label" data-copy-attribute="aria-label">
                <a class="site-nav__link" href="./ogc.html" data-copy="common.nav.home"></a>
                <a class="site-nav__link" href="./ogc.html#camp" data-copy="common.nav.camp"></a>
                <a class="site-nav__link" href="./about.html" data-copy="common.nav.about"></a>
                <a class="site-nav__link" href="./tools.html" aria-current="page" data-copy="common.nav.tools"></a>
            </nav>
            <a class="header-cta" href="./ogc.html#camp"><span data-copy="common.nav.visit"></span><span aria-hidden="true">↗</span></a>
        </header>

        <main>
            <section class="tools-hero page-width" aria-labelledby="tools-title">
                <p class="eyebrow"><span class="tools-hero__mark" aria-hidden="true"></span><span data-copy="hero.eyebrow"></span></p>
                <h1 id="tools-title"><span data-copy="hero.titleFirst"></span><br><span class="tools-hero__accent" data-copy="hero.titleAccent"></span></h1>
                <p data-copy="hero.description"></p>
                <a class="tools-hero__scroll" href="#directory"><span data-copy="hero.scroll"></span><span aria-hidden="true">↓</span></a>
            </section>

            <section class="tools-directory page-width" id="directory" aria-labelledby="directory-title">
                <div class="tools-section-heading">
                    <div>
                        <p class="eyebrow" data-copy="directory.eyebrow"></p>
                        <h2 id="directory-title" data-copy="directory.title"></h2>
                    </div>
                    <p data-copy="directory.description"></p>
                </div>
                <div class="tool-grid">
                    <article class="tool-card">
                        <span class="tool-card__index" data-copy="cards.0.index"></span>
                        <p class="tool-card__tag" data-copy="cards.0.tag"></p>
                        <h3 data-copy="cards.0.title"></h3>
                        <p class="tool-card__description" data-copy="cards.0.description"></p>
                        <a href="./ogc.html"><span data-copy="cards.0.link"></span><span aria-hidden="true">↗</span></a>
                    </article>
                    <article class="tool-card">
                        <span class="tool-card__index" data-copy="cards.1.index"></span>
                        <p class="tool-card__tag" data-copy="cards.1.tag"></p>
                        <h3 data-copy="cards.1.title"></h3>
                        <p class="tool-card__description" data-copy="cards.1.description"></p>
                        <a href="./about.html"><span data-copy="cards.1.link"></span><span aria-hidden="true">↗</span></a>
                    </article>
                    <article class="tool-card">
                        <span class="tool-card__index" data-copy="cards.2.index"></span>
                        <p class="tool-card__tag" data-copy="cards.2.tag"></p>
                        <h3 data-copy="cards.2.title"></h3>
                        <p class="tool-card__description" data-copy="cards.2.description"></p>
                        <a href="./102.html"><span data-copy="cards.2.link"></span><span aria-hidden="true">↗</span></a>
                    </article>
                </div>
            </section>

            <section class="content-source">
                <div class="page-width content-source__inner">
                    <div>
                        <p class="eyebrow" data-copy="content.eyebrow"></p>
                        <h2><span data-copy="content.title"></span><br><span class="tools-hero__accent" data-copy="content.titleAccent"></span></h2>
                        <p class="content-source__description" data-copy="content.description"></p>
                    </div>
                    <div class="content-source__file">
                        <span data-copy="content.filesLabel"></span>
                        <code data-copy="content.files"></code>
                    </div>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <a class="brand" href="./ogc.html" data-copy="common.brand.logoAlt" data-copy-attribute="aria-label">
                <img src="../Resources/img/OGC.webp" alt="" width="34" height="34">
                <span class="brand__name" data-copy="common.brand.short"></span>
            </a>
            <p data-copy="common.footer.tagline"></p>
            <span class="site-footer__copyright" data-copy="common.footer.copyright"></span>
            <a class="site-footer__domain" href="https://www.ogc.l2.ink/"><span data-copy="common.domain"></span><span aria-hidden="true">↗</span></a>
        </footer>
    </div>
</body>
</html>
