<!doctype html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b10">
    <meta name="description" data-copy="meta.description" data-copy-attribute="content" content="">
    <title data-copy="meta.title"></title>
    <link rel="icon" href="../Resources/img/OGC.webp" type="image/webp">
    <link rel="stylesheet" href="../styles/General%20Style.css">
    <link rel="stylesheet" href="../styles/pages%20styles/about/about.css">
    <script src="../styles/General%20Style.js" defer></script>
    <script src="../styles/pages%20styles/about/about.js" defer></script>
</head>
<body data-site-copy="../Resources/txt/site.json" data-page-copy="../Resources/txt/about%20web/about.json" data-copy-state="loading">
    <div class="copy-loading" aria-hidden="true"><span class="copy-loading__spinner"></span></div>
    <div class="copy-error" data-copy-error role="alert" hidden>页面文案无法载入，请检查网络连接后刷新页面。</div>
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="./ogc.html" data-copy="common.brand.logoAlt" data-copy-attribute="aria-label">
                <img src="../Resources/img/OGC.webp" alt="" width="42" height="42">
                <span class="brand__name" data-copy="common.brand.short"></span>
                <span class="brand__full" data-copy="common.brand.full"></span>
            </a>
            <a class="site-domain" href="https://www.ogc.l2.ink/">
                <span class="site-domain__dot" aria-hidden="true"></span><span data-copy="common.domain"></span>
            </a>
            <nav class="site-nav" data-copy="common.nav.label" data-copy-attribute="aria-label">
                <a class="site-nav__link" href="./ogc.html" data-copy="common.nav.home"></a>
                <a class="site-nav__link" href="./ogc.html#camp" data-copy="common.nav.camp"></a>
                <a class="site-nav__link" href="./about.html" aria-current="page" data-copy="common.nav.about"></a>
                <a class="site-nav__link" href="./tools.html" data-copy="common.nav.tools"></a>
            </nav>
            <a class="header-cta" href="./ogc.html#camp"><span data-copy="common.nav.visit"></span><span aria-hidden="true">↗</span></a>
        </header>

        <main>
            <section class="about-hero page-width" aria-labelledby="about-title">
                <div class="about-hero__copy">
                    <p class="eyebrow"><span class="about-hero__line" aria-hidden="true"></span><span data-copy="hero.eyebrow"></span></p>
                    <h1 id="about-title"><span data-copy="hero.titleFirst"></span><br><span class="about-accent" data-copy="hero.titleAccent"></span></h1>
                    <p data-copy="hero.description"></p>
                </div>
                <aside class="about-hero__aside">
                    <span class="about-hero__aside-index" data-copy="hero.asideLabel"></span>
                    <p data-copy="hero.asideText"></p>
                    <a href="#our-story"><span data-copy="hero.asideAction"></span><span aria-hidden="true">↓</span></a>
                </aside>
                <div class="about-hero__rule"></div>
            </section>

            <section class="about-story page-width" id="our-story" aria-labelledby="story-title">
                <div class="about-story__heading">
                    <p class="eyebrow" data-copy="story.eyebrow"></p>
                    <h2 id="story-title"><span data-copy="story.titleFirst"></span><br><span data-copy="story.titleAccent"></span></h2>
                </div>
                <div class="about-story__body">
                    <p data-copy="story.paragraphOne"></p>
                    <p data-copy="story.paragraphTwo"></p>
                    <a class="text-link" href="./ogc.html"><span data-copy="story.link"></span><span aria-hidden="true">↗</span></a>
                </div>
            </section>

            <section class="about-values" aria-labelledby="values-title">
                <div class="page-width">
                    <div class="about-values__heading">
                        <p class="eyebrow" data-copy="values.eyebrow"></p>
                        <h2 id="values-title"><span data-copy="values.titleFirst"></span><br><span data-copy="values.titleAccent"></span></h2>
                    </div>
                    <div class="value-grid">
                        <article class="value-card about-reveal">
                            <span class="value-card__index" data-copy="values.cards.0.index"></span>
                            <h3 data-copy="values.cards.0.title"></h3>
                            <p data-copy="values.cards.0.description"></p>
                        </article>
                        <article class="value-card about-reveal">
                            <span class="value-card__index" data-copy="values.cards.1.index"></span>
                            <h3 data-copy="values.cards.1.title"></h3>
                            <p data-copy="values.cards.1.description"></p>
                        </article>
                        <article class="value-card about-reveal">
                            <span class="value-card__index" data-copy="values.cards.2.index"></span>
                            <h3 data-copy="values.cards.2.title"></h3>
                            <p data-copy="values.cards.2.description"></p>
                        </article>
                    </div>
                </div>
            </section>

            <section class="about-cta page-width" aria-labelledby="about-cta-title">
                <div>
                    <p class="eyebrow" data-copy="cta.eyebrow"></p>
                    <h2 id="about-cta-title"><span data-copy="cta.title"></span><br><span class="about-accent" data-copy="cta.titleAccent"></span></h2>
                </div>
                <a class="button button--primary" href="./ogc.html"><span data-copy="cta.button"></span><span aria-hidden="true">↗</span></a>
            </section>
        </main>

        <footer class="site-footer">
            <a class="brand" href="./ogc.html" data-copy="common.brand.logoAlt" data-copy-attribute="aria-label">
                <img src="../Resources/img/OGC.webp" alt="" width="34" height="34">
                <span class="brand__name" data-copy="common.brand.short"></span>
            </a>
            <p data-copy="common.footer.tagline"></p>
            <span class="site-footer__copyright" data-copy="common.footer.copyright"></span>
            <a class="site-footer__domain" href="https://www.ogc.l2.ink/"><span data-copy="common.domain"></span><span aria-hidden="true">↗</span></a>
        </footer>
    </div>
</body>
</html>
