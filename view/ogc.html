<!doctype html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b10">
    <meta name="description" data-copy="meta.description" data-copy-attribute="content" content="">
    <meta property="og:title" data-copy="meta.title" data-copy-attribute="content" content="">
    <meta property="og:description" data-copy="meta.description" data-copy-attribute="content" content="">
    <meta property="og:url" content="https://www.ogc.l2.ink/view/ogc.html">
    <link rel="canonical" href="https://www.ogc.l2.ink/view/ogc.html">
    <title data-copy="meta.title"></title>
    <link rel="icon" href="../Resources/img/OGC.webp" type="image/webp">
    <link rel="stylesheet" href="../styles/General%20Style.css">
    <link rel="stylesheet" href="../styles/pages%20styles/ogc/ogc.css">
    <script src="../styles/General%20Style.js" defer></script>
    <script src="../styles/pages%20styles/ogc/ogc.js" defer></script>
</head>
<body data-site-copy="../Resources/txt/site.json" data-page-copy="../Resources/txt/ogc%20web/ogc.json" data-copy-state="loading">
    <div class="copy-loading" aria-hidden="true"><span class="copy-loading__spinner"></span></div>
    <div class="copy-error" data-copy-error role="alert" hidden>页面文案无法载入，请检查网络连接后刷新页面。</div>
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="./ogc.html" data-copy="common.brand.logoAlt" data-copy-attribute="aria-label">
                <img src="../Resources/img/OGC.webp" alt="" width="42" height="42">
                <span class="brand__name" data-copy="common.brand.short"></span>
                <span class="brand__full" data-copy="common.brand.full"></span>
            </a>
            <a class="site-domain" href="https://www.ogc.l2.ink/">
                <span class="site-domain__dot" aria-hidden="true"></span>
                <span data-copy="common.domain"></span>
            </a>
            <nav class="site-nav" aria-label="主导航" data-copy="common.nav.label" data-copy-attribute="aria-label">
                <a class="site-nav__link site-nav__link--active" href="#top" aria-current="page" data-copy="common.nav.home"></a>
                <a class="site-nav__link" href="#camp" data-copy="common.nav.camp"></a>
                <a class="site-nav__link" href="./about.html" data-copy="common.nav.about"></a>
                <a class="site-nav__link" href="./tools.html" data-copy="common.nav.tools"></a>
            </nav>
            <a class="header-cta" href="#camp">
                <span data-copy="common.nav.visit"></span><span aria-hidden="true">↗</span>
            </a>
        </header>

        <main>
            <section class="hero page-width" id="top" aria-labelledby="hero-title">
                <div class="hero__copy">
                    <p class="eyebrow"><span class="eyebrow__mark" aria-hidden="true"></span><span data-copy="hero.eyebrow"></span></p>
                    <h1 id="hero-title"><span data-copy="hero.titleFirst"></span><br><span class="hero__title-accent" data-copy="hero.titleAccent"></span></h1>
                    <p class="hero__description" data-copy="hero.description"></p>
                    <div class="hero__actions">
                        <a class="button button--primary" href="#camp"><span data-copy="hero.primary"></span><span aria-hidden="true">↓</span></a>
                        <a class="text-link" href="./about.html"><span data-copy="hero.secondary"></span><span aria-hidden="true">↗</span></a>
                    </div>
                    <p class="hero__footnote"><span aria-hidden="true"></span><span data-copy="hero.footnote"></span></p>
                </div>

                <div class="camp-art" role="img" data-copy="hero.artAlt" data-copy-attribute="aria-label">
                    <div class="camp-art__grid"></div>
                    <div class="camp-art__orbit camp-art__orbit--outer"></div>
                    <div class="camp-art__orbit camp-art__orbit--inner"></div>
                    <div class="camp-art__pixels" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
                    <img class="camp-art__mark" src="../Resources/img/OGC.webp" alt="" width="142" height="142">
                    <span class="camp-art__badge" data-copy="hero.artBadge"></span>
                    <span class="camp-art__caption" data-copy="hero.artLine"></span>
                    <span class="camp-art__chip" data-copy="hero.artChip"></span>
                </div>
                <a class="scroll-cue" href="#camp"><span></span><span data-copy="hero.scroll"></span></a>
            </section>

            <section class="camp-section" id="camp" aria-labelledby="camp-title">
                <div class="section-heading page-width">
                    <div>
                        <p class="eyebrow" data-copy="intro.eyebrow"></p>
                        <h2 id="camp-title"><span data-copy="intro.titleFirst"></span><br><span class="section-heading__accent" data-copy="intro.titleAccent"></span></h2>
                    </div>
                    <p class="section-heading__description" data-copy="intro.description"></p>
                </div>
                <div class="feature-grid page-width">
                    <article class="feature-card">
                        <span class="feature-card__number" data-copy="features.0.tag"></span>
                        <span class="feature-card__symbol" aria-hidden="true">✦</span>
                        <h3 data-copy="features.0.title"></h3>
                        <p data-copy="features.0.description"></p>
                    </article>
                    <article class="feature-card">
                        <span class="feature-card__number" data-copy="features.1.tag"></span>
                        <span class="feature-card__symbol" aria-hidden="true">⌘</span>
                        <h3 data-copy="features.1.title"></h3>
                        <p data-copy="features.1.description"></p>
                    </article>
                    <article class="feature-card">
                        <span class="feature-card__number" data-copy="features.2.tag"></span>
                        <span class="feature-card__symbol" aria-hidden="true">↗</span>
                        <h3 data-copy="features.2.title"></h3>
                        <p data-copy="features.2.description"></p>
                    </article>
                </div>
            </section>

            <section class="camp-cta page-width" aria-labelledby="cta-title">
                <div>
                    <p class="eyebrow" data-copy="cta.eyebrow"></p>
                    <h2 id="cta-title"><span data-copy="cta.title"></span><br><span class="camp-cta__accent" data-copy="cta.titleAccent"></span></h2>
                    <p data-copy="cta.description"></p>
                </div>
                <a class="button button--primary" href="./about.html"><span data-copy="cta.button"></span><span aria-hidden="true">↗</span></a>
            </section>
        </main>

        <footer class="site-footer">
            <a class="brand" href="./ogc.html" data-copy="common.brand.logoAlt" data-copy-attribute="aria-label">
                <img src="../Resources/img/OGC.webp" alt="" width="34" height="34">
                <span class="brand__name" data-copy="common.brand.short"></span>
            </a>
            <p data-copy="common.footer.tagline"></p>
            <span class="site-footer__copyright" data-copy="common.footer.copyright"></span>
            <a class="site-footer__domain" href="https://www.ogc.l2.ink/"><span data-copy="common.domain"></span><span aria-hidden="true">↗</span></a>
        </footer>
    </div>
</body>
</html>
