<!doctype html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b10">
    <meta name="description" data-copy="meta.description" data-copy-attribute="content" content="">
    <link rel="canonical" href="https://www.ogc.l2.ink/">
    <title data-copy="meta.title"></title>
    <link rel="icon" href="Resources/img/ogcweb.webp" type="image/webp">
    <link rel="stylesheet" href="styles/General%20Style.css">
    <link rel="stylesheet" href="styles/pages%20styles/index/index.css">
    <script src="styles/General%20Style.js" defer></script>
    <script src="styles/pages%20styles/index/index.js" defer></script>
</head>
<body class="loading-page" data-site-copy="Resources/txt/site.json" data-page-copy="Resources/txt/index web/index.json" data-prefetch-copy="Resources/txt/ogc web/ogc.json" data-copy-state="loading">
    <div class="copy-loading" aria-hidden="true"><span class="copy-loading__spinner"></span></div>
    <div class="copy-error" data-copy-error role="alert" hidden>页面文案暂时无法载入，请检查网络连接后刷新页面。</div>
    <noscript><div class="copy-error">本网站需要启用 JavaScript 才能载入并显示页面文案。</div></noscript>
    <div class="site-shell">
        <main class="loader" aria-labelledby="loading-title">
            <div class="loader__identity">
                <a class="loader__brand" href="view/ogc.html" data-copy="common.brand.logoAlt" data-copy-attribute="aria-label">
                    <img src="Resources/img/ogcweb.webp" alt="" width="140" height="140">
                </a>
                <span class="loader__brand-name" data-copy="common.brand.full"></span>
            </div>
            <p class="loader__domain" data-copy="common.domain"></p>
            <p class="loader__eyebrow" data-copy="loading.eyebrow"></p>
            <h1 id="loading-title"><span class="loader__title-main" data-copy="loading.titleFirst"></span><br><span data-copy="loading.titleAccent"></span></h1>
            <p class="loader__message" id="loading-status" data-copy="loading.status" role="status" aria-live="polite"></p>
            <div class="loader__track" role="progressbar" data-copy="common.brand.full" data-copy-attribute="aria-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span class="loader__progress"></span>
            </div>
            <p class="loader__hint" data-copy="loading.hint"></p>
            <a class="loader__fallback" href="view/ogc.html"><span data-copy="loading.continue"></span><span aria-hidden="true">↗</span></a>
        </main>
    </div>
</body>
</html>
